[project]
name = "careerflow-agent"
version = "0.1.5"
description = "CareerFlow local workflow, policy, document, and AI service"
requires-python = ">=3.13,<3.14"
dependencies = [
  "aiosqlite>=0.21.0",
  "alembic>=1.16.5",
  "cryptography>=45.0.6",
  "fastapi>=0.116.1",
  "greenlet>=3.2.4",
  "httpx>=0.28.1",
  "keyring>=25.6.0",
  "langgraph>=0.6.6",
  "openai>=1.102.0",
  "opentelemetry-api>=1.36.0",
  "opentelemetry-exporter-otlp-proto-http>=1.36.0",
  "opentelemetry-instrumentation-fastapi>=0.57b0",
  "opentelemetry-instrumentation-httpx>=0.57b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.57b0",
  "opentelemetry-sdk>=1.36.0",
  "pydantic-settings>=2.10.1",
  "pypdf>=6.0.0",
  "python-docx>=1.2.0",
  "python-multipart>=0.0.20",
  "sqlalchemy>=2.0.43",
  "uvicorn>=0.35.0",
]

[project.scripts]
careerflow-agent = "careerflow_agent.__main__:main"

[dependency-groups]
dev = [
  "mypy>=1.17.1",
  "pytest>=8.4.1",
  "pytest-asyncio>=1.1.0",
  "ruff>=0.12.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careerflow_agent"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["careerflow_agent"]

[[tool.mypy.overrides]]
module = ["keyring.*"]
ignore_missing_imports = true
