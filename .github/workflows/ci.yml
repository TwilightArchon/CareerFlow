name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.1
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: 0.12.5
          enable-cache: true
      - name: Verify toolchain
        run: |
          node --version
          pnpm --version
          uv --version
      - run: pnpm install --frozen-lockfile
      - run: uv sync --project services/agent --frozen
      - run: pnpm contracts:generate
      - run: git diff --exit-code -- packages/contracts/openapi.json packages/contracts/src/generated.ts
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
